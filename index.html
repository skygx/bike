<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd0ef">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%238fd0ef'/%3E%3Ccircle%20cx='18'%20cy='44'%20r='9'%20fill='none'%20stroke='%23123442'%20stroke-width='4'/%3E%3Ccircle%20cx='46'%20cy='44'%20r='9'%20fill='none'%20stroke='%23123442'%20stroke-width='4'/%3E%3Ccircle%20cx='29'%20cy='23'%20r='9'%20fill='white'/%3E%3Cpath%20d='M36%2020L60%2023L36%2027Z'%20fill='%23ffae35'/%3E%3C/svg%3E">
<title>鹈鹕沿海骑行 · Pelican Coast Ride</title>
<style>
  :root{
    --ink:#123442;
    --card:rgba(255,255,255,.82);
    --line:rgba(18,52,66,.14);
    --accent:#ff8a3d;
    --gold:#ffc43d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#8fd0ef;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
  #app,#scene{position:fixed;inset:0}
  #scene canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(7,50,80,.16) 100%);transition:box-shadow .18s}
  #vignette.hit{box-shadow:inset 0 0 120px 40px rgba(255,60,60,.55)}
  #vignette.boost{box-shadow:inset 0 0 110px 26px rgba(255,190,70,.35)}
  #hud{position:fixed;inset:0;pointer-events:none;
    padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 6px 22px rgba(9,52,80,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .hud-left{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .score-card{padding:8px 16px 9px;min-width:112px}
  .label{font-size:11px;letter-spacing:.14em;opacity:.62;font-weight:700}
  .big{font-size:34px;line-height:1.02;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .sub{font-size:11px;opacity:.7;margin-top:2px}
  .sub span{font-weight:800}
  .stats-card{padding:8px 12px;min-width:150px;font-size:12px}
  .row{display:flex;justify-content:space-between;gap:14px;line-height:1.7}
  .row span{opacity:.62}
  .row b{font-weight:700;font-variant-numeric:tabular-nums}
  #lives{color:#e2493f;letter-spacing:2px}
  .energy{margin-top:6px;height:6px;border-radius:6px;background:rgba(18,52,66,.13);overflow:hidden}
  .energy i{display:block;height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#ffd05b,#ff8a3d);transition:width .08s linear}
  .hud-right{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    display:flex;gap:8px;pointer-events:auto}
  button{font-family:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--line);
    background:var(--card);box-shadow:0 4px 14px rgba(9,52,80,.14);backdrop-filter:blur(8px)}
  .icon-btn{height:38px;min-width:44px;padding:0 11px;border-radius:12px;font-size:13px;font-weight:700}
  .icon-btn:active,.round:active,.boost-btn:active,.jump-btn:active,.primary:active{transform:scale(.94)}
  #boostTag{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    padding:5px 16px;border-radius:20px;background:rgba(255,156,60,.92);color:#fff;font-size:12px;
    font-weight:800;letter-spacing:.16em;opacity:0;transition:opacity .15s;box-shadow:0 4px 14px rgba(220,110,20,.35)}
  #boostTag.on{opacity:1}
  #toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:30px;font-weight:900;
    color:#fff;text-shadow:0 3px 0 rgba(210,120,0,.65),0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none}
  #toast.pop{animation:pop .7s ease-out}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(12px) scale(.7)}
    22%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.12)}
    100%{opacity:0;transform:translateX(-50%) translateY(-46px) scale(1)}}
  #hint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 16px;
    font-size:12px;white-space:nowrap;opacity:1;transition:opacity .8s;box-shadow:0 4px 14px rgba(9,52,80,.12)}
  #hint.fade{opacity:0}
  #touchControls{display:none}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,42,64,.42);backdrop-filter:blur(5px);pointer-events:auto}
  #overlay.hidden{display:none}
  .panel{width:min(88vw,360px);padding:26px 24px 22px;text-align:center;border-radius:22px;
    background:rgba(255,255,255,.94);box-shadow:0 18px 60px rgba(6,40,66,.3)}
  .panel h1{margin:0 0 6px;font-size:26px;letter-spacing:.02em}
  .panel p{margin:0 0 18px;font-size:13px;line-height:1.7;opacity:.75}
  .panel .final{font-size:44px;font-weight:900;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
  .panel .record{font-size:12px;font-weight:800;color:#e08b12;letter-spacing:.1em;height:16px}
  .primary{width:100%;height:46px;border-radius:14px;border:none;color:#fff;font-size:15px;font-weight:800;
    background:linear-gradient(135deg,#ff9d47,#ff6f3c);box-shadow:0 8px 20px rgba(240,110,40,.35);margin-top:14px}
  .keys{margin-top:14px;font-size:11px;opacity:.6;line-height:1.7}
  @media (pointer:coarse),(max-width:820px){
    #touchControls{display:block}
    .pad-left{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));
      display:flex;gap:12px;pointer-events:auto}
    .round{width:64px;height:64px;border-radius:50%;font-size:22px;font-weight:800;
      background:rgba(255,255,255,.78);touch-action:none;pointer-events:auto}
    .boost-btn{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));
      width:82px;height:82px;border-radius:50%;font-size:15px;font-weight:900;color:#fff;
      background:linear-gradient(135deg,rgba(255,180,70,.95),rgba(255,110,55,.95));
      border:2px solid rgba(255,255,255,.7);touch-action:none;pointer-events:auto}
    .jump-btn{position:absolute;right:calc(108px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
      width:62px;height:62px;border-radius:50%;font-size:16px;font-weight:900;color:#fff;
      background:linear-gradient(135deg,rgba(90,196,232,.95),rgba(40,116,205,.95));
      border:2px solid rgba(255,255,255,.7);touch-action:none;pointer-events:auto}
    #hint{bottom:calc(112px + env(safe-area-inset-bottom));font-size:11px;padding:6px 12px}
    .score-card{min-width:96px;padding:6px 12px 7px}
    .big{font-size:28px}
    .stats-card{min-width:126px;font-size:11px;padding:6px 10px}
    .icon-btn{height:34px;min-width:38px;padding:0 8px;font-size:12px}
  }
  @media (max-height:480px){
    .stats-card{display:none}
    #hint{display:none}
    .round{width:54px;height:54px}
    .boost-btn{width:68px;height:68px}
    .jump-btn{width:52px;height:52px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div class="hud-left">
      <div class="card score-card">
        <div class="label">分数</div>
        <div id="score" class="big">0</div>
        <div class="sub">最高 <span id="best">0</span></div>
      </div>
      <div class="card stats-card">
        <div class="row"><span>速度</span><b id="speed">0</b></div>
        <div class="row"><span>视角</span><b id="viewName">跟随</b></div>
        <div class="row"><span>体力</span><b id="lives">♥♥♥</b></div>
        <div class="energy"><i id="energyBar"></i></div>
      </div>
    </div>
    <div class="hud-right">
      <button id="btnView" class="icon-btn" title="切换视角 (C)">视角</button>
      <button id="btnSound" class="icon-btn" title="音效">♪</button>
      <button id="btnPause" class="icon-btn" title="暂停 (P)">Ⅱ</button>
    </div>
    <div id="boostTag">BOOST</div>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="touchControls">
      <div class="pad-left">
        <button id="btnLeft" class="round" aria-label="左移">◀</button>
        <button id="btnRight" class="round" aria-label="右移">▶</button>
      </div>
      <button id="btnJump" class="jump-btn" aria-label="跳跃">跳</button>
      <button id="btnBoost" class="boost-btn" aria-label="加速">加速</button>
    </div>
    <div id="overlay" class="hidden">
      <div class="panel">
        <h1 id="ovTitle"></h1>
        <div id="ovScore" class="final"></div>
        <div id="ovRecord" class="record"></div>
        <p id="ovDesc"></p>
        <button id="ovBtn" class="primary"></button>
        <div id="ovKeys" class="keys"></div>
      </div>
    </div>
  </div>
</div>
<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
